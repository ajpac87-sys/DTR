<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
/* DTR — shop-floor look.
   Graphite top bar, concrete ground, signal-orange for the one thing to do
   next. Condensed road-sign lettering (Barlow Condensed) for unit and job
   numbers and headings; Atkinson Hyperlegible for reading, built to stay
   clear at a glance. Big tap targets for gloved hands. */

:root {
  --ground: #e8ebee;  --panel: #ffffff;  --ink: #141a21;  --ink-2: #4c5764;
  --rule: #cdd3da;    --bar: #1d242c;    --bar-ink: #eef1f4;  --bar-dim: #9aa6b3;
  --signal: #d9480f;  --signal-ink: #ffffff;  --signal-soft: #fde8da;  --link: #b23c07;
  --stop: #b3121d;    --stop-soft: #fbe2e3;
  --caution: #7d5300; --caution-soft: #fff0c2;
  --go: #17703a;      --go-soft: #dcf2e3;
  --focus: #2563eb;
  --sign: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif-condensed, system-ui, sans-serif;
  --read: "Atkinson Hyperlegible", "Noto Sans Devanagari", "Noto Nastaliq Urdu", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1216;  --panel: #171e25;  --ink: #e6e9ed;  --ink-2: #9ba7b3;
    --rule: #29323c;    --bar: #090c0f;    --bar-ink: #eef1f4;  --bar-dim: #8794a1;
    --signal: #ff7b24;  --signal-ink: #1a0b00;  --signal-soft: #3b1e0b;  --link: #ff9a52;
    --stop: #ff8d93;    --stop-soft: #3a1417;
    --caution: #ffd36b; --caution-soft: #362908;
    --go: #7fdc9c;      --go-soft: #10301b;
    --focus: #7aa7ff;   color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1216;  --panel: #171e25;  --ink: #e6e9ed;  --ink-2: #9ba7b3;
  --rule: #29323c;    --bar: #090c0f;    --bar-ink: #eef1f4;  --bar-dim: #8794a1;
  --signal: #ff7b24;  --signal-ink: #1a0b00;  --signal-soft: #3b1e0b;  --link: #ff9a52;
  --stop: #ff8d93;    --stop-soft: #3a1417;
  --caution: #ffd36b; --caution-soft: #362908;
  --go: #7fdc9c;      --go-soft: #10301b;
  --focus: #7aa7ff;   color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink);
  font: 17px/1.5 var(--read); -webkit-text-size-adjust: 100%; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* --- top bar and tabs (one graphite band) --- */
header { display: flex; justify-content: space-between; align-items: center; gap: 10px;
  background: var(--bar); color: var(--bar-ink);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.logo { font: 700 1.6rem/1 var(--sign); letter-spacing: .06em; color: var(--bar-ink);
  border-bottom: 4px solid var(--signal); padding-bottom: 1px; }
.org { color: var(--bar-dim); font-size: .9rem; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
header select.lang { background: transparent; color: var(--bar-ink); border-color: #3a4652; }
header select.lang option { color: initial; }
header button.link { color: var(--bar-ink); }
nav { display: flex; gap: 2px; overflow-x: auto; background: var(--bar);
  padding: 0 max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); }
nav button { border: 0; background: none; color: var(--bar-dim); padding: 10px 12px 9px;
  font: 600 1.05rem/1 var(--sign); letter-spacing: .04em; text-transform: uppercase;
  white-space: nowrap; border-bottom: 4px solid transparent; cursor: pointer; }
nav button.on { color: var(--bar-ink); border-bottom-color: var(--signal); }
[dir="rtl"] nav button { text-transform: none; letter-spacing: 0; font-family: var(--read); font-size: .95rem; }

main { max-width: 760px; margin: 0 auto;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px)); }

/* --- type --- */
h1 { font: 700 1.9rem/1.1 var(--sign); letter-spacing: .01em; margin: 6px 0 12px; text-wrap: balance; }
h2 { font: 700 1.25rem/1.2 var(--sign); letter-spacing: .03em; text-transform: uppercase;
  margin: 22px 0 8px; color: var(--ink); }
[dir="rtl"] h1, [dir="rtl"] h2, [lang="hi"] h1, [lang="hi"] h2 {
  font-family: var(--read); text-transform: none; letter-spacing: 0; }
[dir="rtl"] h1 { font-size: 1.5rem; } [dir="rtl"] h2, [lang="hi"] h2 { font-size: 1.05rem; }
.muted { color: var(--ink-2); }
.small { font-size: .86rem; }
.big { font: 700 1.5rem/1.1 var(--sign); letter-spacing: .02em; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.warn-text { color: var(--caution); } .bad-text { color: var(--stop); }
code { font-size: .85rem; }

/* --- layout helpers --- */
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 6px; }
.grow { flex: 1; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.wide { width: 100%; }

/* --- panels --- */
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 14px; margin-bottom: 10px; }
.list-item { display: flex; justify-content: space-between; align-items: center; gap: 10px;
  width: 100%; text-align: start; font: inherit; color: inherit; cursor: pointer; }
.list-item:active { background: var(--ground); }
.clip { display: block; margin: 6px 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { font-size: 1.6rem; color: var(--ink-2); }
[dir="rtl"] .chev { transform: scaleX(-1); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; }
dt { color: var(--ink-2); } dd { margin: 0; overflow-wrap: anywhere; }

/* The job number, stamped like a shop tag. */
.tag { display: inline-block; font: 700 1.05rem/1 var(--sign); letter-spacing: .08em;
  border: 2px solid var(--ink); border-radius: 3px; padding: 3px 7px 2px; }
h1 .tag { font-size: 1.7rem; padding: 4px 10px 3px; }

/* --- forms --- */
label { display: block; font-size: .9rem; color: var(--ink-2); margin: 12px 0 4px; }
input, select, textarea { width: 100%; font: inherit; padding: 12px; min-height: 48px;
  border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); color: var(--ink); }
textarea { min-height: 0; }
select.auto, select.lang { width: auto; }
select.lang { min-height: 38px; padding: 6px 8px; font-size: .9rem; }
button.primary, button.secondary, label.filebtn { font: 700 1.05rem/1.1 var(--sign); letter-spacing: .05em;
  text-transform: uppercase; padding: 12px 18px; min-height: 50px; border-radius: var(--radius);
  border: 2px solid transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
[dir="rtl"] button.primary, [dir="rtl"] button.secondary, [dir="rtl"] label.filebtn,
[lang="hi"] button.primary, [lang="hi"] button.secondary, [lang="hi"] label.filebtn {
  font-family: var(--read); text-transform: none; letter-spacing: 0; font-size: 1rem; }
button.primary { background: var(--signal); color: var(--signal-ink); }
button.secondary, label.filebtn { background: var(--panel); color: var(--ink); border-color: var(--ink); }
label.filebtn { margin: 0; }
button.link { background: none; border: 0; color: var(--link); font: inherit; padding: 6px 2px; cursor: pointer; }
button:disabled { opacity: .45; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 10px 0; }
label.check { display: flex; align-items: center; gap: 8px; color: var(--ink); margin: 0; font-size: 1rem; }
label.check input { width: 22px; height: 22px; min-height: 0; accent-color: var(--signal); }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--link); font-weight: 700; padding: 8px 0; }
blockquote { margin: 6px 0 4px; padding: 12px 14px; background: var(--ground);
  border-inline-start: 4px solid var(--ink); border-radius: 0 var(--radius) var(--radius) 0; }
[dir="rtl"] blockquote { border-radius: var(--radius) 0 0 var(--radius); }

/* --- chips: status, priority, filters --- */
.pill { display: inline-block; font: 700 .82rem/1 var(--sign); letter-spacing: .06em; text-transform: uppercase;
  padding: 5px 8px 4px; border-radius: 3px; background: var(--ground); color: var(--ink-2);
  border: 1px solid var(--rule); white-space: nowrap; }
[dir="rtl"] .pill, [lang="hi"] .pill { font-family: var(--read); text-transform: none; letter-spacing: 0; font-weight: 600; }
.pill.p-urgent { background: var(--stop); color: var(--panel); border-color: var(--stop); }
.pill.p-high { background: var(--caution-soft); color: var(--caution); border-color: transparent; }
.pill.st-in_progress { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.pill.st-waiting_parts { background: var(--caution-soft); color: var(--caution); border-color: transparent; }
.pill.st-complete { background: var(--go-soft); color: var(--go); border-color: transparent; }
.pill.st-closed { background: transparent; color: var(--go); border-color: var(--go); }
.pill.st-cancelled { text-decoration: line-through; }
button.linkish { cursor: pointer; color: var(--link); border-color: var(--link); }
.chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 12px; padding-bottom: 2px; }
.chips button { font: 600 .95rem/1 var(--read); white-space: nowrap; padding: 9px 14px; min-height: 40px;
  border-radius: var(--radius); border: 1px solid var(--rule); background: var(--panel); color: var(--ink-2); cursor: pointer; }
.chips button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }

/* --- messages --- */
.msg { padding: 10px 12px; border-radius: var(--radius); margin: 8px 0; font-size: .95rem; }
.msg.bad { background: var(--stop-soft); color: var(--stop); }
.msg.warn { background: var(--caution-soft); color: var(--caution); }
.msg.ok { background: var(--go-soft); color: var(--go); }
.msg ul { margin: 4px 0 0; padding-inline-start: 18px; }
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: 480px; margin: 0 auto; background: var(--bar); color: var(--bar-ink); padding: 14px 16px;
  border-radius: var(--radius); text-align: center; border-bottom: 4px solid var(--signal); }

/* --- work order detail --- */
.field { margin-bottom: 12px; }
.field .lbl { font: 700 .82rem/1.2 var(--sign); color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em; }
[dir="rtl"] .field .lbl, [lang="hi"] .field .lbl { font-family: var(--read); text-transform: none; letter-spacing: 0; }
.line { display: flex; gap: 8px; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed var(--rule); }
.line:last-of-type { border-bottom: 0; }
.line.voided .grow > :first-child { text-decoration: line-through; color: var(--ink-2); }
.voidbox { padding: 6px 0 10px; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 10px; }
.photos figure { margin: 0; }
.photos img { width: 100%; max-width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; background: var(--ground); }
.photos figcaption { font-size: .78rem; color: var(--ink-2); }

/* --- sign-in --- */
.login { max-width: 400px; margin: 8vh auto 0; }
.login h1 { font-size: 2.2rem; }
.quick { display: grid; gap: 8px; margin-top: 16px; }
.quick button { text-align: start; font-family: var(--read); text-transform: none; letter-spacing: 0;
  font-weight: 400; justify-content: flex-start; border-color: var(--rule); }
.preview-bar { background: var(--signal); color: var(--signal-ink); text-align: center;
  font: 700 .85rem/1.3 var(--sign); letter-spacing: .06em; text-transform: uppercase;
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }

/* --- other scripts --- */
[lang="ur"] body { font-family: "Noto Nastaliq Urdu", "Noto Naskh Arabic", var(--read); line-height: 2; }
[lang="hi"] body { font-family: "Noto Sans Devanagari", var(--read); }
/* Names, dates and numbers keep their own reading direction inside Urdu. */
.muted, .pill, dd { unicode-bidi: plaintext; }
header .row { flex-wrap: nowrap; flex-shrink: 0; }

</style>

<script>
// DTR preview: a pretend server that runs inside the page.
//
// It answers the same addresses the real server does, with sample data held
// in memory, so the real screens (app.js) can be clicked through without a
// backend. It follows the main rules (who may do what, sign-off by typed
// name, signed jobs corrected by amendment) but it is NOT the real server:
// the real rules and their tests live in dtr/. Nothing here is saved; reload
// the page and it starts over.
"use strict";
(function () {
  const L = () => window.DTR_LOCALES;
  let lang = "en";
  const tx = (key, p = {}) => {
    let s = (L()[lang] || {})[key] || L().en[key] || key;
    for (const [k, v] of Object.entries(p)) s = s.split("{" + k + "}").join(v);
    return s;
  };
  const now = () => new Date().toISOString();
  const ago = (h) => new Date(Date.now() - h * 3600e3).toISOString();
  const id = () => Math.random().toString(16).slice(2) + Date.now().toString(16);
  const today = () => new Date().toISOString().slice(0, 10);
  const daysAgo = (d) => new Date(Date.now() - d * 864e5).toISOString().slice(0, 10);

  // ---------------------------------------------------------- sample world
  const ORG = { org_id: "org_demo", name: "Demo Fleet Co (sample)" };
  const PEOPLE = [
    { user_id: "u_admin", name: "Maria Lopez", email: "maria@demo.example", role: "admin" },
    { user_id: "u_lead", name: "Luis Ortega", email: "luis@demo.example", role: "shop_manager" },
    { user_id: "u_jose", name: "José Ramírez", email: "jose@demo.example", role: "mechanic" },
    { user_id: "u_harp", name: "Harpreet Singh", email: "harpreet@demo.example", role: "mechanic" },
    { user_id: "u_imran", name: "Imran Khan", email: "imran@demo.example", role: "mechanic" },
    { user_id: "u_fran", name: "Fran Lee", email: "fran@demo.example", role: "fleet_manager" },
  ].map((p) => ({ ...p, org_id: ORG.org_id, active: true, language: null }));
  const OPS = { user_id: "u_ops", name: "Apex", email: "ops@apex.example", role: "platform_operator",
                org_id: null, active: true, language: null };
  const USERS = [...PEOPLE, OPS];
  const P = Object.fromEntries(USERS.map((u) => [u.user_id, u]));

  const unit = (n, type, vin, year, make, model, plate, odo, extra = {}) => ({
    asset_id: "a_" + n.replace(/\W/g, ""), org_id: ORG.org_id, asset_type: type, unit_number: n,
    unit_number_key: n.toUpperCase(), vin, model_year: year, make, model, plate, plate_state: plate ? "CA" : null,
    owned_by_carrier: true, furnished_by: null, odometer: odo, engine_hours: null,
    odometer_at: odo != null ? ago(30) : null, odometer_by: odo != null ? "Maria Lopez" : null,
    notes: null, status: "active", retired_at: null, created_at: ago(400), ...extra });
  const UNITS = [
    unit("101", "power_unit", "1M8GDM9AXKP042788", 2019, "Freightliner", "Cascadia", "8ABC123", 412870),
    unit("102", "power_unit", "1XKYD49X7KJ123456", 2020, "Kenworth", "T680", "8XYZ789", 301550),
    unit("105", "power_unit", "3AKJHHDR5LSLA1234", 2021, "Freightliner", "Cascadia", "9DEF456", 188020),
    unit("108", "power_unit", "1XPBD49X1MD765432", 2022, "Peterbilt", "579", "9GHI321", 96400),
    unit("T-7", "trailer", "1UYVS2538KU123456", 2018, "Utility", "3000R reefer", "4AB1234", null,
         { engine_hours: 11240, engine_hours_at: ago(30), engine_hours_by: "Maria Lopez" }),
    unit("T-8", "trailer", "1JJV532D8KL123456", 2019, "Wabash", "DuraPlate", "4AB5678", null),
    unit("T-12", "trailer", null, 2011, "Great Dane", "Flatbed", "4CD9012", null,
         { owned_by_carrier: false, furnished_by: "Penske Leasing" }),
  ];
  const U = (n) => UNITS.find((u) => u.unit_number === n);

  let woNo = 0;
  const WOS = [];
  const line = (by, at, data) => ({ line_id: id(), at, by: by.user_id, by_name: by.name, ...data });
  const job = (unitNo, data, extra = {}) => {
    const u = U(unitNo);
    const by = P[data.by || "u_fran"];
    const w = {
      work_order_id: "wo_" + (++woNo), org_id: ORG.org_id, number: woNo, asset_id: u.asset_id,
      unit_number: u.unit_number, asset_type: u.asset_type, complaint: data.complaint, cause: null,
      correction: null, priority: data.priority || "normal", category: data.category || "other",
      source: data.source || "manual", source_ref: data.source_ref || null, odometer: data.odometer ?? null,
      engine_hours: null, status: "open", assigned: [], labor: [], parts: [], vendor: [], notes: [],
      photos: [], amendments: [], history: [{ at: ago(data.age || 5), by: by.user_id, by_name: by.name, from: null, to: "open" }],
      signoff: null, closed: null, cancelled: null, created_at: ago(data.age || 5),
      created_by: by.user_id, created_name: by.name, updated_at: ago(1), ...extra };
    WOS.push(w);
    return w;
  };
  const step = (w, to, who, hAgo) => { w.history.push({ at: ago(hAgo), by: who.user_id, by_name: who.name, from: w.status, to }); w.status = to; };
  const tech = (uid) => ({ user_id: uid, name: P[uid].name });

  // A spread of jobs across the ladder.
  let w = job("101", { complaint: "Driver reports left rear brake light out", priority: "high",
    category: "lighting", source: "dvir_defect", age: 6 });
  w.assigned = [tech("u_jose")];
  step(w, "in_progress", P.u_jose, 4);
  w.labor.push(line(P.u_jose, ago(3), { user_id: "u_jose", name: "José Ramírez", hours: 0.5, date: today(), note: "Diagnóstico" }));

  w = job("102", { complaint: "Air leak at driver side brake chamber, audible with brakes applied",
    priority: "urgent", category: "brakes", source: "roadside", source_ref: "CA-RI-55120", age: 20, by: "u_lead" });
  w.assigned = [tech("u_harp")];
  step(w, "in_progress", P.u_harp, 18); step(w, "waiting_parts", P.u_harp, 16);
  w.cause = "Cracked type 30/30 spring brake chamber diaphragm";
  w.labor.push(line(P.u_harp, ago(17), { user_id: "u_harp", name: "Harpreet Singh", hours: 1.25, date: daysAgo(1), note: "Leak check, pulled chamber" }));
  w.parts.push(line(P.u_harp, ago(16), { part_number: "3030-SBC", description: "Spring brake chamber 30/30", qty: 1, unit_cost: 89.5 }));
  w.notes.push(line(P.u_lead, ago(15), { text: "Chamber on order from FleetPride, ETA tomorrow AM" }));

  w = job("T-7", { complaint: "Reefer unit not holding temp, alarm code 63", priority: "high",
    category: "refrigeration", age: 3 });

  w = job("105", { complaint: "PM-A service due", priority: "normal", category: "pm_service",
    source: "pm", odometer: 188020, age: 30, by: "u_lead" });
  w.assigned = [tech("u_imran")];
  step(w, "in_progress", P.u_imran, 28);
  w.cause = "Scheduled service"; w.correction = "Changed oil and filters, greased chassis, checked brakes and tires. All within spec.";
  w.labor.push(line(P.u_imran, ago(27), { user_id: "u_imran", name: "Imran Khan", hours: 2.5, date: daysAgo(1), note: null }));
  w.parts.push(line(P.u_imran, ago(27), { part_number: "LF14000NN", description: "Oil filter", qty: 1, unit_cost: 38.2 }));
  w.parts.push(line(P.u_imran, ago(27), { part_number: "15W40", description: "Engine oil, gal", qty: 11, unit_cost: 14.5 }));
  w.signoff = { user_id: "u_imran", name: "Imran Khan", role: "mechanic", typed_name: "Imran Khan", at: ago(26),
    statement: "I did or supervised the work on this job, and it is complete as described in the correction above.", statement_lang: "en" };
  step(w, "complete", P.u_imran, 26);

  w = job("108", { complaint: "Steer tire worn on outer edge", priority: "normal", category: "tires_wheels", age: 80 });
  w.assigned = [tech("u_jose")];
  step(w, "in_progress", P.u_jose, 78);
  w.cause = "Toe out of spec"; w.correction = "Replaced RF steer tire, sent out for alignment";
  w.labor.push(line(P.u_jose, ago(77), { user_id: "u_jose", name: "José Ramírez", hours: 1, date: daysAgo(3), note: null }));
  w.vendor.push(line(P.u_lead, ago(70), { vendor: "Valley Alignment", invoice_number: "VA-20931", description: "3-axle alignment", amount: 245 }));
  w.signoff = { user_id: "u_jose", name: "José Ramírez", role: "mechanic", typed_name: "José Ramírez", at: ago(69),
    statement: "Yo realicé o supervisé el trabajo de esta orden, y está completo tal como se describe en la corrección de arriba.", statement_lang: "es" };
  step(w, "complete", P.u_jose, 69);
  w.closed = { user_id: "u_lead", name: "Luis Ortega", at: ago(60) };
  step(w, "closed", P.u_lead, 60);

  const LOG = [];
  const log = (who, action) => LOG.push({ seq: LOG.length + 1, org_id: ORG.org_id, at: now(),
    actor_user_id: who.user_id, actor_name: who.name, actor_role: who.role, action, before: null, after: null });
  [["u_ops", "org.created"], ["u_ops", "user.created"], ["u_admin", "units.imported"],
   ["u_lead", "wo.created"], ["u_imran", "wo.signed"], ["u_lead", "wo.closed"]]
    .forEach(([u, a]) => log(P[u], a));

  // ---------------------------------------------------------- plumbing
  let me = null;
  const PERMS = { admin: ["edit_units", "import_units", "manage_people", "read_audit"],
    fleet_manager: ["edit_units", "import_units", "manage_people"], shop_manager: ["edit_units", "manage_people"],
    mechanic: [], platform_operator: [] };
  const GRANT = { admin: ["mechanic", "shop_manager", "fleet_manager", "admin"], fleet_manager: ["fleet_manager"],
    shop_manager: ["mechanic", "shop_manager"], mechanic: [], platform_operator: [] };
  const LEADS = ["shop_manager", "admin"], TECHS = ["mechanic", "shop_manager", "admin"];
  const STAFF = ["mechanic", "shop_manager", "fleet_manager", "admin"];
  const ACTIVE = ["open", "in_progress", "waiting_parts"], SIGNED = ["complete", "closed"];

  class Stop { constructor(status, detail) { this.status = status; this.detail = detail; } }
  const stop = (status, key, p) => { throw new Stop(status, tx(key, p)); };
  const stopMany = (errors) => { throw new Stop(400, { errors }); };
  const reply = (status, body) => ({ ok: status < 400, status,
    json: async () => body, blob: async () => body });
  const totals = (w) => {
    const live = (l) => l.filter((x) => !x.voided);
    const parts = live(w.parts).reduce((s, l) => s + (l.qty || 0) * (l.unit_cost || 0), 0);
    const vendor = live(w.vendor).reduce((s, l) => s + (l.amount || 0), 0);
    return { labor_hours: live(w.labor).reduce((s, l) => s + (l.hours || 0), 0),
      parts_cost: parts, vendor_cost: vendor, cost_without_labor: parts + vendor };
  };
  const out = (w) => ({ ...JSON.parse(JSON.stringify(w)), totals: totals(w) });
  const mustBe = (ok, key = "err.not_allowed") => { if (!ok) stop(403, key); };
  const numOr = (v, field, max, allowZero = true) => {
    if (v === null || v === undefined || v === "") return [null, null];
    const n = Number(String(v).replace(/,/g, ""));
    if (Number.isNaN(n)) return [null, tx("err.not_a_number", { field: tx("field." + field) })];
    if (n < 0 || (!allowZero && n === 0)) return [null, tx("err.must_be_positive", { field: tx("field." + field) })];
    if (max && n > max) return [null, tx("err.too_large", { field: tx("field." + field), max })];
    return [n, null];
  };
  const stamp = () => ({ line_id: id(), at: now(), by: me.user_id, by_name: me.name });
  const norm = (s) => (s || "").trim().replace(/\s+/g, " ").toLocaleLowerCase();
  const pub = (u) => ({ user_id: u.user_id, name: u.name, email: u.email, role: u.role,
    org_id: u.org_id, active: u.active, language: u.language || "en" });

  // Sign-in: any password works in the preview; the quick buttons fill it in.
  const routes = [];
  const on = (method, pattern, fn) => routes.push([method, new RegExp("^" + pattern + "$"), fn]);

  on("POST", "/api/auth/login", (b) => {
    const u = USERS.find((x) => x.email === (b.email || "").toLowerCase());
    if (!u) stop(401, "err.bad_login");
    me = u;
    return { token: "preview-" + u.user_id, user: pub(u), org: u.org_id ? ORG : null };
  });
  on("GET", "/api/me", () => { if (!me) stop(401, "err.sign_in_first"); return { user: pub(me), org: me.org_id ? ORG : null, can: PERMS[me.role] }; });
  on("PATCH", "/api/me", (b) => { me.language = b.language; return { language: b.language }; });

  // --- units
  on("GET", "/api/assets", (b, q) => {
    let rows = UNITS.filter((u) => u.status === (q.get("status") || "active"));
    if (q.get("type")) rows = rows.filter((u) => u.asset_type === q.get("type"));
    const n = (q.get("q") || "").trim().toUpperCase();
    if (n) rows = rows.filter((u) => u.unit_number_key.includes(n) || (u.vin || "").includes(n) || (u.plate || "").includes(n));
    return { units: rows };
  });
  on("GET", "/api/assets/([^/]+)", (b, q, [aid]) => {
    const u = UNITS.find((x) => x.asset_id === aid);
    if (!u) stop(404, "err.no_such_unit");
    return u;
  });
  const unitFrom = (b, old = {}) => {
    const errors = [];
    const v = { ...old, ...b };
    if (!["power_unit", "trailer"].includes(v.asset_type)) errors.push(tx("unit.err.type_required"));
    if (!(v.unit_number || "").trim()) errors.push(tx("unit.err.number_required"));
    const key = (v.unit_number || "").trim().toUpperCase();
    if (key && UNITS.some((u) => u.unit_number_key === key && u.asset_id !== old.asset_id))
      errors.push(tx("unit.err.exists", { unit: v.unit_number }));
    if (!v.owned_by_carrier && !(v.furnished_by || "").trim()) errors.push(tx("unit.err.furnished_by_required"));
    if (errors.length) stopMany(errors);
    return { ...v, unit_number: v.unit_number.trim(), unit_number_key: key,
      vin: v.vin ? v.vin.toUpperCase().replace(/[\s-]/g, "") : null,
      model_year: v.model_year ? Number(v.model_year) : null,
      odometer: v.odometer != null && v.odometer !== "" ? Number(v.odometer) : null,
      engine_hours: v.engine_hours != null && v.engine_hours !== "" ? Number(v.engine_hours) : null };
  };
  on("POST", "/api/assets", (b) => {
    mustBe(PERMS[me.role].includes("edit_units"), "err.role_cannot_edit_units");
    const u = { ...unitFrom(b), asset_id: "a_" + id(), org_id: ORG.org_id, status: "active", created_at: now() };
    if (u.odometer != null) { u.odometer_at = now(); u.odometer_by = me.name; }
    UNITS.push(u); log(me, "unit.created");
    return { unit: u, warnings: [] };
  });
  on("PATCH", "/api/assets/([^/]+)", (b, q, [aid]) => {
    mustBe(PERMS[me.role].includes("edit_units"), "err.role_cannot_edit_units");
    const i = UNITS.findIndex((x) => x.asset_id === aid);
    const old = UNITS[i];
    const u = unitFrom(b, old);
    if (u.odometer !== old.odometer) { u.odometer_at = now(); u.odometer_by = me.name; }
    UNITS[i] = u; log(me, "unit.edited");
    return { unit: u, warnings: [] };
  });
  on("POST", "/api/assets/([^/]+)/retire", (b, q, [aid]) => {
    mustBe(PERMS[me.role].includes("edit_units"), "err.role_cannot_edit_units");
    if (!(b.reason || "").trim()) stop(400, "err.retire_reason_required");
    const u = UNITS.find((x) => x.asset_id === aid);
    Object.assign(u, { status: "retired", retired_at: now(), retired_reason: b.reason.trim() });
    log(me, "unit.retired");
    return { unit: u };
  });
  on("POST", "/api/assets/import", () => stop(400, "app.preview_banner"));

  // --- people
  on("GET", "/api/users", () => ({ users: PEOPLE.map(pub),
    may_add: PERMS[me.role].includes("manage_people") ? GRANT[me.role] : [] }));
  on("POST", "/api/users", (b) => {
    mustBe(PERMS[me.role].includes("manage_people") && GRANT[me.role].includes(b.role));
    if ((b.password || "").length < 8) stop(400, "err.password_short");
    if (USERS.some((u) => u.email === (b.email || "").toLowerCase())) stop(409, "err.email_taken");
    const u = { user_id: "u_" + id(), name: b.name.trim(), email: b.email.toLowerCase(), role: b.role,
      org_id: ORG.org_id, active: true, language: b.language };
    PEOPLE.push(u); USERS.push(u); P[u.user_id] = u; log(me, "user.created");
    return pub(u);
  });

  // --- log and console
  on("GET", "/api/audit", () => { mustBe(me.role === "admin", "err.admin_only_log"); return { entries: [...LOG].reverse() }; });
  on("GET", "/api/audit/verify", () => ({ ok: true, entries: LOG.length }));
  on("GET", "/api/operator/orgs", () => { mustBe(me.role === "platform_operator", "err.operator_only");
    return { orgs: [{ ...ORG, units: UNITS.filter((u) => u.status === "active").length, people: PEOPLE.length }] }; });
  on("POST", "/api/operator/orgs", () => stop(400, "app.preview_banner"));

  // --- work orders
  on("GET", "/api/workorders/meta", () => ({
    statuses: ["open", "in_progress", "waiting_parts", "complete", "closed", "cancelled"],
    priorities: ["urgent", "high", "normal", "low"],
    categories: ["engine", "brakes", "tires_wheels", "electrical", "lighting", "suspension_steering", "drivetrain",
      "cooling", "fuel", "exhaust_aftertreatment", "hvac", "body_frame", "coupling", "refrigeration", "pm_service",
      "inspection", "other"],
    sources: ["manual", "dvir_defect", "pm", "breakdown", "roadside", "inspection"],
    techs: PEOPLE.filter((p) => ["mechanic", "shop_manager"].includes(p.role)).map((p) => ({ user_id: p.user_id, name: p.name, role: p.role })),
    may: { create: STAFF.includes(me.role), work: TECHS.includes(me.role), lead: LEADS.includes(me.role), note: STAFF.includes(me.role) } }));
  const RANK = { urgent: 0, high: 1, normal: 2, low: 3 };
  on("GET", "/api/workorders", (b, q) => {
    const view = q.get("view") || "active";
    let rows = WOS.filter((w) => view === "all" || (view === "active" ? ACTIVE.includes(w.status) : w.status === view));
    if (q.get("mine") === "true") rows = rows.filter((w) => w.assigned.some((a) => a.user_id === me.user_id) || w.labor.some((l) => l.user_id === me.user_id));
    if (q.get("asset_id")) rows = rows.filter((w) => w.asset_id === q.get("asset_id"));
    rows.sort(view === "active" ? (a, c) => RANK[a.priority] - RANK[c.priority] || a.number - c.number : (a, c) => c.number - a.number);
    return { work_orders: rows.map(out) };
  });
  const get = (wid) => { const w = WOS.find((x) => x.work_order_id === wid); if (!w) stop(404, "wo.err.not_found"); return w; };
  on("GET", "/api/workorders/([^/]+)", (b, q, [wid]) => out(get(wid)));
  on("POST", "/api/workorders", (b) => {
    mustBe(STAFF.includes(me.role));
    const u = UNITS.find((x) => x.asset_id === b.asset_id);
    const errors = [];
    if (!u) errors.push(tx("wo.err.need_unit"));
    if (!(b.complaint || "").trim()) errors.push(tx("wo.err.need_complaint"));
    if (errors.length) stopMany(errors);
    const w = job(u.unit_number, { ...b, complaint: b.complaint.trim(), by: me.user_id, age: 0 });
    log(me, "wo.created");
    return out(w);
  });
  on("PATCH", "/api/workorders/([^/]+)", (b, q, [wid]) => {
    const w = get(wid);
    mustBe(TECHS.includes(me.role));
    if (!ACTIVE.includes(w.status)) stop(400, "wo.err.signed_use_amend");
    if ("complaint" in b && !(b.complaint || "").trim()) stopMany([tx("wo.err.need_complaint")]);
    for (const f of ["complaint", "cause", "correction", "priority", "category"]) if (f in b) w[f] = b[f] || null;
    for (const f of ["odometer", "engine_hours"]) if (f in b) w[f] = b[f] == null ? null : Number(b[f]);
    log(me, "wo.edited");
    return out(w);
  });
  const MOVES = { open: ["in_progress", "waiting_parts"], in_progress: ["open", "waiting_parts"], waiting_parts: ["open", "in_progress"] };
  on("POST", "/api/workorders/([^/]+)/status", (b, q, [wid]) => {
    const w = get(wid); mustBe(TECHS.includes(me.role));
    if (!(MOVES[w.status] || []).includes(b.status)) stop(400, "wo.err.bad_move");
    step(w, b.status, me, 0); log(me, "wo.status"); return out(w);
  });
  on("POST", "/api/workorders/([^/]+)/assign", (b, q, [wid]) => {
    const w = get(wid); mustBe(LEADS.includes(me.role));
    w.assigned = b.user_ids.map(tech); log(me, "wo.assigned"); return out(w);
  });
  const amendOk = (w, reason) => {
    if (w.status === "cancelled") stop(400, "wo.err.cancelled");
    if (SIGNED.includes(w.status)) {
      mustBe(LEADS.includes(me.role) || (w.signoff && w.signoff.user_id === me.user_id), "wo.err.cannot_amend");
      if (!(reason || "").trim()) stop(400, "wo.err.need_reason");
      return { amended: true, reason: reason.trim() };
    }
    return {};
  };
  on("POST", "/api/workorders/([^/]+)/labor", (b, q, [wid]) => {
    const w = get(wid); mustBe(TECHS.includes(me.role));
    const extra = amendOk(w, b.reason);
    let who = { user_id: me.user_id, name: me.name };
    if (b.user_id && b.user_id !== me.user_id) { mustBe(LEADS.includes(me.role), "wo.err.own_labor_only"); who = tech(b.user_id); }
    const [hours, e] = numOr(b.hours, "hours", 24, false);
    if (e || hours == null) stopMany([e || tx("err.required", { field: tx("field.hours") })]);
    w.labor.push({ ...stamp(), ...who, hours, date: b.date || today(), note: b.note || null, ...extra });
    log(me, "wo.labor"); return out(w);
  });
  on("POST", "/api/workorders/([^/]+)/parts", (b, q, [wid]) => {
    const w = get(wid); mustBe(TECHS.includes(me.role));
    const extra = amendOk(w, b.reason);
    const errors = [];
    if (!b.part_number && !b.description) errors.push(tx("err.part_needs_name"));
    const [qty, e1] = numOr(b.qty, "qty", 100000, false); if (e1 || qty == null) errors.push(e1 || tx("err.required", { field: tx("field.qty") }));
    const [cost, e2] = numOr(b.unit_cost, "unit_cost", 1e6); if (e2) errors.push(e2);
    if (errors.length) stopMany(errors);
    w.parts.push({ ...stamp(), part_number: b.part_number, description: b.description, qty, unit_cost: cost, ...extra });
    log(me, "wo.part"); return out(w);
  });
  on("POST", "/api/workorders/([^/]+)/vendor", (b, q, [wid]) => {
    const w = get(wid); mustBe(TECHS.includes(me.role));
    const extra = amendOk(w, b.reason);
    if (!(b.vendor || "").trim()) stopMany([tx("err.required", { field: tx("field.vendor") })]);
    const [amount, e] = numOr(b.amount, "amount", 1e7); if (e) stopMany([e]);
    w.vendor.push({ ...stamp(), vendor: b.vendor, invoice_number: b.invoice_number, description: b.description, amount, ...extra });
    log(me, "wo.vendor"); return out(w);
  });
  on("POST", "/api/workorders/([^/]+)/void", (b, q, [wid]) => {
    const w = get(wid); mustBe(TECHS.includes(me.role));
    if (!(b.reason || "").trim()) stop(400, "wo.err.need_reason");
    if (SIGNED.includes(w.status)) mustBe(LEADS.includes(me.role) || (w.signoff && w.signoff.user_id === me.user_id), "wo.err.cannot_amend");
    const l = (w[b.kind] || []).find((x) => x.line_id === b.line_id && !x.voided);
    if (!l) stop(404, "wo.err.no_line");
    if (!LEADS.includes(me.role) && l.by !== me.user_id) stop(403, "wo.err.own_lines_only");
    Object.assign(l, { voided: true, void_reason: b.reason.trim(), voided_by: me.name, voided_at: now() });
    log(me, "wo.void"); return out(w);
  });
  on("POST", "/api/workorders/([^/]+)/notes", (b, q, [wid]) => {
    const w = get(wid); mustBe(STAFF.includes(me.role));
    if (!(b.text || "").trim()) stopMany([tx("err.required", { field: tx("field.note") })]);
    w.notes.push({ ...stamp(), text: b.text.trim() }); log(me, "wo.note"); return out(w);
  });
  const PHOTOS = {};
  on("POST", "/api/workorders/([^/]+)/photos", (b, q, [wid]) => {
    const w = get(wid); mustBe(STAFF.includes(me.role));
    const pid = id(); PHOTOS[pid] = b.get("file");
    w.photos.push({ ...stamp(), photo_id: pid, caption: b.get("caption") || null }); log(me, "wo.photo"); return out(w);
  });
  on("GET", "/api/workorders/([^/]+)/photos/([^/]+)", (b, q, [, pid]) => PHOTOS[pid]);
  on("POST", "/api/workorders/([^/]+)/complete", (b, q, [wid]) => {
    const w = get(wid);
    const errors = [];
    if (!ACTIVE.includes(w.status)) errors.push(tx("wo.err.not_open"));
    const worked = w.assigned.some((a) => a.user_id === me.user_id) || w.labor.some((l) => l.user_id === me.user_id && !l.voided);
    if (!(LEADS.includes(me.role) || (me.role === "mechanic" && worked))) errors.push(tx("wo.err.cannot_sign"));
    if (!w.correction) errors.push(tx("wo.err.need_correction"));
    if (!b.typed_name || norm(b.typed_name) !== norm(me.name)) errors.push(tx("wo.err.name_mismatch", { name: me.name }));
    if (errors.length) stopMany(errors);
    w.signoff = { user_id: me.user_id, name: me.name, role: me.role, typed_name: b.typed_name.trim(), at: now(),
      statement: tx("wo.signoff.statement"), statement_lang: lang };
    step(w, "complete", me, 0); log(me, "wo.signed");
    const warnings = [];
    if (!w.labor.some((l) => !l.voided)) warnings.push(tx("wo.warn.no_labor"));
    if (!w.cause) warnings.push(tx("wo.warn.no_cause"));
    return { ...out(w), warnings };
  });
  on("POST", "/api/workorders/([^/]+)/close", (b, q, [wid]) => {
    const w = get(wid); mustBe(LEADS.includes(me.role));
    if (w.status !== "complete") stop(400, "wo.err.close_needs_complete");
    w.closed = { user_id: me.user_id, name: me.name, at: now() }; step(w, "closed", me, 0); log(me, "wo.closed"); return out(w);
  });
  on("POST", "/api/workorders/([^/]+)/cancel", (b, q, [wid]) => {
    const w = get(wid); mustBe(LEADS.includes(me.role));
    if (!(b.reason || "").trim()) stop(400, "wo.err.need_reason");
    if (!ACTIVE.includes(w.status)) stop(400, "wo.err.not_open");
    w.cancelled = { user_id: me.user_id, name: me.name, at: now(), reason: b.reason.trim() };
    step(w, "cancelled", me, 0); log(me, "wo.cancelled"); return out(w);
  });
  on("POST", "/api/workorders/([^/]+)/amend", (b, q, [wid]) => {
    const w = get(wid);
    if (!SIGNED.includes(w.status)) stop(400, "wo.err.amend_needs_signed");
    mustBe(LEADS.includes(me.role) || (w.signoff && w.signoff.user_id === me.user_id), "wo.err.cannot_amend");
    if (!(b.reason || "").trim()) stop(400, "wo.err.need_reason");
    let v = (b.value || "").trim() || null;
    if (["odometer", "engine_hours"].includes(b.field) && v !== null) v = Number(v);
    if (w[b.field] === v) stop(400, "wo.err.no_change");
    w.amendments.push({ ...stamp(), field: b.field, before: w[b.field], after: v, reason: b.reason.trim() });
    w[b.field] = v; log(me, "wo.amended"); return out(w);
  });

  // ---------------------------------------------------------- the fetch stand-in
  window.DTR_FETCH = async (path, opts = {}) => {
    const url = new URL(path, "https://preview.local");
    const method = (opts.method || "GET").toUpperCase();
    lang = (opts.headers && opts.headers["X-Lang"]) || "en";
    let body = {};
    if (opts.body instanceof FormData) body = opts.body;
    else if (opts.body) body = JSON.parse(opts.body);
    for (const [m, re, fn] of routes) {
      const hit = method === m && url.pathname.match(re);
      if (!hit) continue;
      try { return reply(200, await fn(body, url.searchParams, hit.slice(1))); }
      catch (e) {
        if (e instanceof Stop) return reply(e.status, { detail: e.detail });
        console.error(e); return reply(500, { detail: "Preview error" });
      }
    }
    return reply(404, { detail: "Not in preview" });
  };

  // Quick sign-in buttons for each role.
  const QUICK = [["u_jose", "mechanic"], ["u_harp", "mechanic"], ["u_lead", "shop_manager"],
                 ["u_fran", "fleet_manager"], ["u_admin", "admin"], ["u_ops", "platform_operator"]];
  window.DTR_PREVIEW = {
    loginHelp: () => `<div class="quick">
      ${QUICK.map(([u, r]) => `<button type="button" class="secondary wide" data-quick="${u}">
        <b>${P[u].name}</b> · ${(L()[document.documentElement.lang] || L().en)["role." + r]}</button>`).join("")}</div>`,
    wireLogin: () => document.querySelectorAll("[data-quick]").forEach((b) => (b.onclick = () => {
      document.querySelector("#em").value = P[b.dataset.quick].email;
      document.querySelector("#pw").value = "preview";
      document.querySelector("#f").requestSubmit();
    })),
  };
})();

</script>
<script>
// DTR screens. Plain JavaScript, no build step.
// The server checks every permission; hiding a button here is only a
// convenience so people don't see things they can't use.
// Every word on screen comes from /static/locales/<lang>.json via t().
"use strict";

const S = { token: null, me: null, orgNames: {}, meta: null, lang: "en",
            dict: {}, en: {}, current: null };
const $ = (sel) => document.querySelector(sel);
const view = $("#view");
const LANGS = { en: "English", es: "Español", hi: "हिन्दी", ur: "اردو" };
const RTL = ["ur"];

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ok */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ok */ } },
};
S.token = store.get("dtr_token");

// ---------------------------------------------------------------- words

function t(key, params) {
  let s = S.dict[key] ?? S.en[key] ?? key;
  if (params) for (const [k, v] of Object.entries(params)) s = s.split("{" + k + "}").join(v);
  return s;
}

async function loadLang(lang) {
  if (!LANGS[lang]) lang = "en";
  const get = async (l) => {
    if (window.DTR_LOCALES) return window.DTR_LOCALES[l] || {};
    const r = await fetch(`/static/locales/${l}.json`);
    return r.ok ? r.json() : {};
  };
  if (!Object.keys(S.en).length) S.en = await get("en");
  S.dict = lang === "en" ? S.en : await get(lang);
  S.lang = lang;
  store.set("dtr_lang", lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL.includes(lang) ? "rtl" : "ltr";
  $("#signout").textContent = t("app.sign_out");
}

function guessLang() {
  const saved = store.get("dtr_lang");
  if (saved && LANGS[saved]) return saved;
  const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
  return LANGS[nav] ? nav : "en";
}

function langPicker(id) {
  return `<select id="${id}" class="lang" aria-label="${esc(t("app.language"))}">${
    Object.entries(LANGS).map(([k, v]) =>
      `<option value="${k}" ${k === S.lang ? "selected" : ""}>${v}</option>`).join("")}</select>`;
}

function wirePicker(id, after) {
  $("#" + id).onchange = async (ev) => {
    await loadLang(ev.target.value);
    if (S.token && S.me) {
      api("/api/me", { method: "PATCH", json: { language: S.lang } }).catch(() => {});
    }
    after();
  };
}

// ---------------------------------------------------------------- helpers

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function toast(text) {
  const el = $("#toast");
  el.textContent = text; el.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (el.hidden = true), 3200);
}

async function api(path, opts = {}) {
  const headers = { "X-Lang": S.lang, ...(opts.headers || {}) };
  if (S.token) headers.Authorization = "Bearer " + S.token;
  if (opts.json !== undefined) {
    headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.json);
  }
  const r = await (window.DTR_FETCH || fetch)(path, { ...opts, headers });
  if (opts.raw) {
    if (!r.ok) throw new Error(t("app.something_wrong"));
    return r;
  }
  let data = null;
  try { data = await r.json(); } catch (e) { /* empty body */ }
  if (r.status === 401 && path !== "/api/auth/login") { signOut(); }
  if (!r.ok) {
    const d = data && data.detail;
    const err = new Error(typeof d === "string" ? d : t("app.something_wrong"));
    err.detail = d; throw err;
  }
  return data;
}

function msgBox(kind, title, items) {
  if (!title && !(items && items.length)) return "";
  const list = items && items.length
    ? "<ul>" + items.map((i) => `<li>${esc(i)}</li>`).join("") + "</ul>" : "";
  return `<div class="msg ${kind}">${esc(title || "")}${list}</div>`;
}

function errorHtml(e) {
  if (e.detail && e.detail.errors) {
    return msgBox("bad", t("app.fix_first"), e.detail.errors) +
           msgBox("warn", "", e.detail.warnings);
  }
  return msgBox("bad", e.message);
}

const can = (p) => S.me && S.me.can.includes(p);
const role = () => S.me && S.me.user.role;
const num = (n) => (n == null ? "" : Number(n).toLocaleString(S.lang));
const money = (n) => new Intl.NumberFormat(S.lang, { style: "currency", currency: "USD" })
  .format(n || 0);
const when = (d) => {
  if (!d) return "";
  const s = String(d);
  const dt = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s + "Z");
  return dt.toLocaleString(S.lang, { dateStyle: "medium", timeStyle: "short" });
};
const day = (d) => (d ? new Date(d + "T12:00:00").toLocaleDateString(S.lang,
  { dateStyle: "medium" }) : "");
const val = (id) => { const el = $("#" + id); return el ? el.value.trim() || null : null; };
const options = (list, prefix, sel, blank) =>
  (blank ? `<option value="">${esc(t("app.choose"))}</option>` : "") +
  list.map((k) => `<option value="${esc(k)}" ${k === sel ? "selected" : ""}>${
    esc(t(prefix + k))}</option>`).join("");

// ---------------------------------------------------------------- sign-in

function showLogin(error) {
  $("#top").hidden = true; $("#tabs").hidden = true;
  view.innerHTML = `
    <div class="login card">
      <div class="row"><h1 class="grow">${esc(t("login.title"))}</h1>${langPicker("lp")}</div>
      ${window.DTR_PREVIEW ? msgBox("warn", t("app.preview_banner")) : ""}
      ${error ? msgBox("bad", error) : ""}
      <form id="f">
        <label for="em">${esc(t("login.email"))}</label>
        <input id="em" type="email" autocomplete="username" required dir="ltr">
        <label for="pw">${esc(t("login.password"))}</label>
        <input id="pw" type="password" autocomplete="current-password" required dir="ltr">
        <p><button class="primary wide">${esc(t("login.button"))}</button></p>
      </form>
      ${window.DTR_PREVIEW ? window.DTR_PREVIEW.loginHelp() : ""}
    </div>`;
  wirePicker("lp", () => showLogin(error));
  if (window.DTR_PREVIEW) window.DTR_PREVIEW.wireLogin();
  $("#f").onsubmit = async (ev) => {
    ev.preventDefault();
    await signIn($("#em").value, $("#pw").value);
  };
}

async function signIn(email, password) {
  try {
    const r = await api("/api/auth/login", { method: "POST", json: { email, password } });
    S.token = r.token;
    store.set("dtr_token", r.token);
    // The language picked on the sign-in screen wins, and is saved to the
    // person so it follows them to any phone.
    if (r.user.language !== S.lang) {
      await api("/api/me", { method: "PATCH", json: { language: S.lang } }).catch(() => {});
    }
    await start();
  } catch (e) { showLogin(e.message); }
}

function signOut() {
  S.token = null; S.me = null; S.orgNames = {}; S.meta = null;
  store.del("dtr_token");
  showLogin();
}
$("#signout").onclick = signOut;

// ---------------------------------------------------------------- tabs

const TABS = {
  platform_operator: ["companies", "units"],
  admin: ["workorders", "units", "people", "log"],
  fleet_manager: ["workorders", "units", "people"],
  shop_manager: ["workorders", "units", "people"],
  mechanic: ["workorders", "units"],
};
const SCREENS = {};

function go(name, arg) {
  S.current = [name, arg];
  document.querySelectorAll("#tabs button").forEach((b) =>
    b.classList.toggle("on", b.dataset.tab === name));
  window.scrollTo(0, 0);
  SCREENS[name](arg).catch((e) => { view.innerHTML = errorHtml(e); });
}

function drawChrome() {
  $("#org-name").textContent = S.me.org ? S.me.org.name : t("app.apex_console");
  $("#hdr-lang").innerHTML = langPicker("hl");
  wirePicker("hl", () => { drawChrome(); go(...S.current); });
  const tabs = TABS[role()] || [];
  const nav = $("#tabs");
  nav.innerHTML = tabs.map((k) => `<button data-tab="${k}">${esc(t("tab." + k))}</button>`).join("");
  nav.hidden = tabs.length < 2;
  nav.querySelectorAll("button").forEach((b) => (b.onclick = () => go(b.dataset.tab)));
}

async function start() {
  if (!S.token) return showLogin();
  try { S.me = await api("/api/me"); } catch (e) { return; }
  if (S.me.user.language && S.me.user.language !== S.lang) await loadLang(S.me.user.language);
  $("#top").hidden = false;
  if (role() === "platform_operator") {
    const r = await api("/api/operator/orgs");
    r.orgs.forEach((o) => (S.orgNames[o.org_id] = o.name));
  } else {
    S.meta = await api("/api/workorders/meta");
  }
  drawChrome();
  go((TABS[role()] || ["units"])[0]);
}

// ---------------------------------------------------------------- work orders

const PRIORITY_CLASS = { urgent: "p-urgent", high: "p-high", normal: "", low: "" };

SCREENS.workorders = async (state = {}) => {
  const filter = state.filter || (role() === "mechanic" ? "mine" : "active");
  const q = filter === "mine" ? "view=active&mine=true" : `view=${filter}`;
  const r = await api(`/api/workorders?${q}`);
  const chips = ["mine", "active", "complete", "closed", "cancelled"];
  view.innerHTML = `
    <div class="row"><h1 class="grow">${esc(t("wo.title"))}</h1>
      ${S.meta.may.create ? `<button class="primary" id="new">${esc(t("wo.new"))}</button>` : ""}</div>
    <div class="chips">${chips.map((c) => `<button data-f="${c}" class="${c === filter ? "on" : ""}">${
      esc(t("wo.filter." + c))}</button>`).join("")}</div>
    ${r.work_orders.map(woRow).join("") || `<div class="card muted">${esc(t("wo.none"))}</div>`}`;
  view.querySelectorAll("[data-f]").forEach((b) =>
    (b.onclick = () => go("workorders", { filter: b.dataset.f })));
  view.querySelectorAll("[data-wo]").forEach((b) =>
    (b.onclick = () => SCREENS.wo(b.dataset.wo)));
  if (S.meta.may.create) $("#new").onclick = () => SCREENS.newWo();
};

function woRow(w) {
  const techs = (w.assigned || []).map((a) => a.name).join(", ") || t("wo.unassigned");
  return `<button class="card list-item" data-wo="${esc(w.work_order_id)}">
    <span class="grow">
      <span class="row tight"><b class="tag">${esc(t("wo.number", { n: String(w.number).padStart(4, "0") }))}</b>
        <span class="pill">${esc(t("wo.unit_line", { unit: w.unit_number }))}</span>
        <span class="pill ${PRIORITY_CLASS[w.priority] || ""}">${esc(t("priority." + w.priority))}</span>
        <span class="pill st-${esc(w.status)}">${esc(t("status." + w.status))}</span></span>
      <span class="clip">${esc(w.complaint)}</span>
      <span class="muted">${esc(t("category." + w.category))} · ${esc(techs)}</span>
    </span><span class="muted chev">›</span></button>`;
}

SCREENS.newWo = async (preset = {}) => {
  const units = (await api("/api/assets")).units;
  const m = S.meta;
  view.innerHTML = `
    <button class="link" id="back">‹ ${esc(t("wo.title"))}</button>
    <h1>${esc(t("wo.new_title"))}</h1><div id="out"></div>
    <form id="f" class="card">
      <label for="asset_id">${esc(t("field.asset_id"))}</label>
      <select id="asset_id" required><option value="">${esc(t("app.choose"))}</option>${
        units.map((u) => `<option value="${esc(u.asset_id)}" ${u.asset_id === preset.asset_id ? "selected" : ""}>${
          esc(u.unit_number)} · ${esc(t("type." + u.asset_type))}${u.make ? " · " + esc(u.make) : ""}</option>`).join("")}</select>
      <label for="complaint">${esc(t("field.complaint"))} — ${esc(t("wo.complaint_help"))}</label>
      <textarea id="complaint" rows="3" required></textarea>
      <div class="two">
        <div><label for="priority">${esc(t("field.priority"))}</label>
          <select id="priority">${options(m.priorities, "priority.", "normal")}</select></div>
        <div><label for="category">${esc(t("field.category"))}</label>
          <select id="category">${options(m.categories, "category.", "other")}</select></div>
      </div>
      <label for="source">${esc(t("field.source"))}</label>
      <select id="source">${options(m.sources, "source.", "manual")}</select>
      <label for="source_ref">${esc(t("field.source_ref"))}</label><input id="source_ref">
      <div class="two">
        <div><label for="odometer">${esc(t("field.odometer"))}</label><input id="odometer" inputmode="numeric" dir="ltr"></div>
        <div><label for="engine_hours">${esc(t("field.engine_hours"))}</label><input id="engine_hours" inputmode="decimal" dir="ltr"></div>
      </div>

  $("#back").onclick = () => go("workorders");
  $("#f").onsubmit = async (ev) => {
    ev.preventDefault();
    const body = {};

      toast(t("wo.created")); SCREENS.wo(wo.work_order_id);

SCREENS.wo = async (id) => {
  S.current = ["wo", id];
  const w = await api(`/api/workorders/${id}`);
  const m = S.meta || { may: {}, techs: [] };
  const active = ["open", "in_progress", "waiting_parts"].includes(w.status);
  const signed = ["complete", "closed"].includes(w.status);
  const me = S.me.user;
  const isSigner = w.signoff && w.signoff.user_id === me.user_id;
  const mayAmend = signed && (m.may.lead || isSigner);
  const mayLines = (active && m.may.work) || mayAmend;
  const no = String(w.number).padStart(4, "0");

  const textBlock = (f) => `<div class="field"><div class="lbl">${esc(t("field." + f))}</div>
    <div class="${w[f] ? "pre" : "muted"}">${esc(w[f] || t("wo.not_entered"))}</div></div>`;

  const lineList = (kind, render) => (w[kind] || []).map((l) => `
    <div class="line ${l.voided ? "voided" : ""}">

        ? `<button class="link small" data-void="${kind}:${esc(l.line_id)}">${esc(t("wo.void"))}</button>` : ""}

  const reasonField = signed ? `<label for="REASON">${esc(t("wo.reason_signed"))}</label><input id="REASON" required>` : "";
  const rf = (id) => reasonField.split("REASON").join(id);

  view.innerHTML = `
    <button class="link" id="back">‹ ${esc(t("wo.title"))}</button>
    <div class="row"><h1 class="grow"><span class="tag">${esc(t("wo.number", { n: no }))}</span></h1>
      <span class="pill st-${esc(w.status)}">${esc(t("status." + w.status))}</span></div>
    <div class="row tight" style="margin-bottom:8px">
      <button class="pill linkish" id="unit">${esc(t("wo.unit_line", { unit: w.unit_number }))} · ${esc(t("type." + w.asset_type))}</button>
      <span class="pill ${PRIORITY_CLASS[w.priority] || ""}">${esc(t("priority." + w.priority))}</span>
      <span class="pill">${esc(t("category." + w.category))}</span>
      <span class="pill">${esc(t("source." + w.source))}${w.source_ref ? " · " + esc(w.source_ref) : ""}</span>
    </div>
    <p class="muted small">${esc(t("wo.opened_by", { name: w.created_name, when: when(w.created_at) }))}</p>
    <div id="out"></div>

    <h2>${esc(t("wo.section.job"))}</h2>
    <div class="card">
      ${textBlock("complaint")}${textBlock("cause")}${textBlock("correction")}
      ${w.odometer != null || w.engine_hours != null ? `<div class="muted small">${
        w.odometer != null ? esc(t("field.odometer")) + ": " + num(w.odometer) : ""}${
        w.engine_hours != null ? " · " + esc(t("field.engine_hours")) + ": " + num(w.engine_hours) : ""}</div>` : ""}
      ${active && m.may.work ? `<p><button class="secondary" id="edit">${esc(t("wo.edit_job"))}</button></p>` : ""}
      <div id="editbox"></div>
    </div>

    ${active && m.may.work ? `<h2>${esc(t("wo.section.status"))}</h2><div class="row">${
      ({ open: ["in_progress", "waiting_parts"], in_progress: ["waiting_parts", "open"],
         waiting_parts: ["in_progress", "open"] }[w.status] || []).map((s) =>
        `<button class="secondary" data-move="${s}">${esc(t("wo.move." + s))}</button>`).join("")}</div>` : ""}

    <h2>${esc(t("wo.section.techs"))}</h2>
    <div class="card">
      <div>${esc((w.assigned || []).map((a) => a.name).join(", ") || t("wo.unassigned"))}</div>
      ${active && m.may.lead ? `<div class="checks">${m.techs.map((p) => `<label class="check"><input type="checkbox" value="${esc(p.user_id)}" ${
        (w.assigned || []).some((a) => a.user_id === p.user_id) ? "checked" : ""}> ${esc(p.name)}</label>`).join("")}</div>
        <button class="secondary" id="assign">${esc(t("wo.assign"))}</button>` : ""}

      ${mayLines ? `<details><summary>${esc(t("wo.add_labor"))}</summary>
        <form id="fl">
          ${m.may.lead && m.techs.length ? `<label for="l_user">${esc(t("field.tech"))}</label>
            <select id="l_user">${m.techs.map((p) => `<option value="${esc(p.user_id)}" ${p.user_id === me.user_id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>` : ""}

          ${rf("p_reason")}

    </div>

    <h2>${esc(t("wo.section.vendor"))} <span class="muted small">${esc(t("wo.vendor_total", { amount: money(w.totals.vendor_cost) }))}</span></h2>
    <div class="card">
      ${lineList("vendor", (l) => `<b>${esc(l.vendor)}</b>${l.invoice_number ? " · " + esc(l.invoice_number) : ""}${
        l.amount != null ? " · " + money(l.amount) : ""}${l.description ? `<div>${esc(l.description)}</div>` : ""}`)}
      ${mayLines ? `<details><summary>${esc(t("wo.add_vendor"))}</summary>
        <form id="fv">
          <label for="v_vendor">${esc(t("field.vendor"))}</label><input id="v_vendor" required>
          <div class="two"><div><label for="v_inv">${esc(t("field.invoice_number"))}</label><input id="v_inv" dir="ltr"></div>
          <div><label for="v_amt">${esc(t("field.amount"))}</label><input id="v_amt" inputmode="decimal" dir="ltr"></div></div>
          <label for="v_desc">${esc(t("field.description"))}</label><input id="v_desc">
          ${rf("v_reason")}

// Phone photos are big. Shrink to 1600 px on the long side as JPEG.
async function shrink(file) {
  const img = await new Promise((ok, bad) => {
    const i = new Image(); i.onload = () => ok(i); i.onerror = bad;
    i.src = URL.createObjectURL(file);
  });
  const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.82));
}

SCREENS.importUnits = async () => {
  view.innerHTML = `
    <button class="link" id="back">‹ ${esc(t("units.title"))}</button>
    <h1>${esc(t("import.title"))}</h1>
    <div class="card">
      <p>${esc(t("import.help"))}</p>
      <p class="muted">${esc(t("import.nothing_saved_until"))}</p>
      <input type="file" id="file" accept=".csv,text/csv">
      <p><button class="primary" id="chk" disabled>${esc(t("import.check"))}</button></p>
    </div>
    <div id="out"></div>`;
  $("#back").onclick = () => go("units");
  $("#file").onchange = () => ($("#chk").disabled = !$("#file").files.length);
  const send = async (commit) => {
    const fd = new FormData(); fd.append("file", $("#file").files[0]);
    return api(`/api/assets/import?commit=${commit}`, { method: "POST", body: fd });
  };
  $("#chk").onclick = async () => {
    try {
      const r = await send(false);
      const bad = r.rows.filter((x) => x.errors.length);
      const warn = r.rows.filter((x) => !x.errors.length && x.warnings.length);
      let html = msgBox(r.ok ? "ok" : "bad",
        r.ok ? t("import.ready", { n: r.count, p: r.power_units, t: r.trailers })
             : t("import.cant_load"), r.problems);
      if (r.ignored_columns && r.ignored_columns.length)
        html += msgBox("warn", t("import.ignored", { cols: r.ignored_columns.join(", ") }));
      if (bad.length) html += `<h2>${esc(t("import.rows_to_fix"))}</h2>` + bad.map((x) =>
        `<div class="card"><b>${esc(t("import.row", { n: x.row }))}</b> ${esc(x.unit_number || "")}${msgBox("bad", "", x.errors)}</div>`).join("");
      if (warn.length) html += `<h2>${esc(t("import.rows_to_look"))}</h2>` + warn.map((x) =>
        `<div class="card"><b>${esc(t("import.row", { n: x.row }))}</b> ${esc(x.unit_number || "")}${msgBox("warn", "", x.warnings)}</div>`).join("");
      if (r.ok) html += `<p><button class="primary wide" id="go">${esc(t("import.load", { n: r.count }))}</button></p>`;
      $("#out").innerHTML = html;
      if (r.ok) $("#go").onclick = async () => {
        $("#go").disabled = true;
        try {
          const done = await send(true);
          if (done.saved) { toast(t("import.loaded", { n: done.saved })); go("units"); }
          else { $("#out").innerHTML = msgBox("bad", t("import.nothing_saved"), done.problems); }
        } catch (e) { $("#out").innerHTML = errorHtml(e); }
      };
    } catch (e) { $("#out").innerHTML = errorHtml(e); }
  };
};

SCREENS.people = async () => {
  const r = await api("/api/users");
  view.innerHTML = `
    <h1>${esc(t("people.title"))}</h1>
    ${r.users.map((u) => `<div class="card row"><span class="grow"><b>${esc(u.name)}</b><br>
      <span class="muted" dir="ltr">${esc(u.email)}</span></span><span class="pill">${esc(t("role." + u.role))}</span></div>`).join("")}
    ${r.may_add.length ? `<h2>${esc(t("people.add_title"))}</h2><div id="out"></div>
    <form id="f" class="card">
      <label for="n">${esc(t("field.name"))}</label><input id="n" required maxlength="80">
      <label for="e">${esc(t("people.email_help"))}</label><input id="e" type="email" required dir="ltr">
      <label for="r">${esc(t("field.role"))}</label><select id="r">${options(r.may_add, "role.", r.may_add[0])}</select>
      <label for="p">${esc(t("people.password_help"))}</label>
      <input id="p" type="text" required minlength="8" autocomplete="off" dir="ltr">
      <p><button class="primary wide">${esc(t("people.add"))}</button></p>
    </form>` : ""}`;
  if (!r.may_add.length) return;
  $("#f").onsubmit = async (ev) => {
    ev.preventDefault();
    try {
      await api("/api/users", { method: "POST", json: { name: $("#n").value,
        email: $("#e").value, role: $("#r").value, password: $("#p").value, language: S.lang } });
      toast(t("people.added"));
      S.meta = await api("/api/workorders/meta");
      go("people");
    } catch (e) { $("#out").innerHTML = errorHtml(e); }
  };
};

// ---------------------------------------------------------------- change log

SCREENS.log = async () => {
  const [r, chk] = await Promise.all([api("/api/audit"), api("/api/audit/verify")]);
  view.innerHTML = `
    <h1>${esc(t("log.title"))}</h1>
    ${chk.ok ? msgBox("ok", t("log.ok", { n: chk.entries }))
             : msgBox("bad", t("log.bad", { seq: chk.at_seq, why: chk.why }))}
    ${r.entries.map((e) => {
      const changed = e.action.endsWith(".edited") || e.action === "wo.amended"
        ? Object.keys(e.after || {}).filter((k) => !/_at$|_by$|_key$|^updated_at$|^reason$/.test(k))
          .map((k) => `${esc(t("field." + k))}: ${esc(e.before ? e.before[k] : "")} → ${esc(e.after[k])}`).join("<br>")
        : "";
      return `<div class="card"><div class="row"><b class="grow">${esc(t("log.action." + e.action))}</b>
        <span class="muted">#${e.seq}</span></div>
        <div class="muted small">${esc(e.actor_name)} (${esc(t("role." + e.actor_role))}) · ${esc(when(e.at))}</div>
        ${changed ? `<div class="muted small">${changed}</div>` : ""}</div>`;
    }).join("")}`;
};

SCREENS.companies = async () => {
  const r = await api("/api/operator/orgs");
  r.orgs.forEach((o) => (S.orgNames[o.org_id] = o.name));
  view.innerHTML = `
    <h1>${esc(t("console.title"))}</h1>
    ${r.orgs.map((o) => `<div class="card row"><span class="grow"><b>${esc(o.name)}</b><br>
      <span class="muted">${esc(t("console.counts", { units: num(o.units), people: num(o.people) }))}</span></span></div>`).join("") ||
      `<div class="card muted">${esc(t("console.none"))}</div>`}
    <h2>${esc(t("console.new_title"))}</h2><div id="out"></div>
    <form id="f" class="card">
      <label for="cn">${esc(t("field.company_name"))}</label><input id="cn" required>
      <label for="an">${esc(t("field.admin_name"))}</label><input id="an" required>
      <label for="ae">${esc(t("field.admin_email"))}</label><input id="ae" type="email" required dir="ltr">
      <label for="ap">${esc(t("field.admin_password"))}</label>
      <input id="ap" type="text" required minlength="8" autocomplete="off" dir="ltr">
      <p><button class="primary wide">${esc(t("console.create"))}</button></p>
    </form>`;
  $("#f").onsubmit = async (ev) => {
    ev.preventDefault();
    try {
      await api("/api/operator/orgs", { method: "POST", json: {
        company_name: $("#cn").value, admin_name: $("#an").value,
        admin_email: $("#ae").value, admin_password: $("#ap").value } });
      toast(t("console.created")); go("companies");
    } catch (e) { $("#out").innerHTML = errorHtml(e); }
  };
};
